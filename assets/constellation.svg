<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- Black Star — gold constellation network. Workflow / AI automation / "how we work" / GitHub team section backdrop. -->
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbf3e3"/>
      <stop offset="40%" stop-color="#e8d5b5"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a86a" stop-opacity=".10"/>
      <stop offset="60%" stop-color="#d4b896" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#e8d5b5" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0a"/>

  <!-- connective threads -->
  <g stroke="url(#thread)" stroke-width="1" fill="none">
    <path d="M180 780 L340 690 L520 700 L680 590 L860 560 L1030 430 L1200 380 L1360 250 L1490 150"/>
    <path d="M340 690 L430 560 L680 590"/>
    <path d="M520 700 L600 470 L860 560"/>
    <path d="M860 560 L940 330 L1200 380"/>
    <path d="M1030 430 L1130 220 L1360 250"/>
    <path d="M180 780 L300 860"/>
    <path d="M680 590 L760 720 L980 690 L1200 380"/>
    <path d="M980 690 L1180 600 L1360 250"/>
  </g>

  <!-- nodes: bright primaries -->
  <g>
    <circle cx="180"  cy="780" r="9"  fill="url(#nodeGlow)" opacity=".9"/>
    <circle cx="520"  cy="700" r="11" fill="url(#nodeGlow)"/>
    <circle cx="860"  cy="560" r="13" fill="url(#nodeGlow)"/>
    <circle cx="1200" cy="380" r="11" fill="url(#nodeGlow)"/>
    <circle cx="1490" cy="150" r="15" fill="url(#nodeGlow)"/>
  </g>

  <!-- nodes: dim secondaries -->
  <g fill="url(#nodeGlow)">
    <circle cx="340"  cy="690" r="5" opacity=".65"/>
    <circle cx="680"  cy="590" r="6" opacity=".7"/>
    <circle cx="1030" cy="430" r="6" opacity=".75"/>
    <circle cx="1360" cy="250" r="6" opacity=".8"/>
    <circle cx="430"  cy="560" r="4" opacity=".45"/>
    <circle cx="600"  cy="470" r="4" opacity=".45"/>
    <circle cx="940"  cy="330" r="4" opacity=".5"/>
    <circle cx="1130" cy="220" r="4" opacity=".5"/>
    <circle cx="300"  cy="860" r="4" opacity=".4"/>
    <circle cx="760"  cy="720" r="5" opacity=".5"/>
    <circle cx="980"  cy="690" r="4" opacity=".45"/>
    <circle cx="1180" cy="600" r="5" opacity=".5"/>
  </g>

  <!-- faint star field -->
  <g fill="#e8d5b5">
    <circle cx="240" cy="300" r="1.1" opacity=".25"/><circle cx="420" cy="180" r=".9" opacity=".2"/>
    <circle cx="700" cy="240" r="1.2" opacity=".3"/><circle cx="980" cy="140" r=".9" opacity=".2"/>
    <circle cx="1300" cy="90" r="1.1" opacity=".25"/><circle cx="1450" cy="520" r="1" opacity=".22"/>
    <circle cx="1500" cy="700" r="1.2" opacity=".28"/><circle cx="120" cy="520" r=".9" opacity=".2"/>
    <circle cx="560" cy="840" r="1" opacity=".22"/><circle cx="900" cy="820" r="1.1" opacity=".25"/>
  </g>
</svg>
