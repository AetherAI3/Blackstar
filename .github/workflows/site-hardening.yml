name: Verify Cloudflare production build
on:
  pull_request:
  push:
    branches: [main, 'loop/LOOP-22-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify-business.py
      - run: python3 scripts/build-cloudflare.py
      - run: python3 scripts/verify-cloudflare.py
      - run: python3 tests/site/deploy-regressions.py
